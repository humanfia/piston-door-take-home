name: ci
on:
  push:
  pull_request:

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: The frozen copy matches redsim/
        run: python tools/freeze.py --check
      - name: The simulator reproduces the real game's verdicts
        run: python -m unittest tests.test_simulator -v
      - name: The starting door works
        run: python -m unittest tests.submission_tests.Correctness -v

  real-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/piston-door-take-home
          key: minecraft-26.3-${{ runner.os }}-${{ hashFiles('minecraft/bridge/**', 'minecraft/setup.py') }}
      - name: Install Java, the Minecraft server and the bridge
        run: python -m minecraft.setup
      - name: The starting door works in the real game
        run: python -m redsim door.txt --real --quick
      - name: Record doors, simulator against the real game, tick by tick
        run: python tools/both.py corpus/doors/sf-holdA-b38-38b.txt corpus/doors/fc2-40b.txt corpus/doors/e78k-h4-42b.txt corpus/doors/e78k-h5-41b.txt corpus/doors/piston-door-3x3-v2-151b.txt --require-same
      - name: Random contraptions, simulator against the real game, tick by tick
        run: |
          python tools/fuzz.py --seeds 0 300 --profile dense --require-same
          python tools/fuzz.py --seeds 0 300 --profile logic --wild --require-same
